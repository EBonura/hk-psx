[package]
name="hk-sim"
version="0.1.0"
edition="2021"
[workspace]
[features]
# Host-only: the kernel reports every state entry, action, event and transition to a sink (oracle replay).
trace = []
# Measurement handlers for the Hornet 1 action types no shipped bank uses yet (fsm3_hard.rs): not in the ordinary build.
hard-ops = []

[dependencies]
psx-math = { path = "../../.psoxide/sdk/crates/psx-math" }
hk-format={path="../hk-format"}
