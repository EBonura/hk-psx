# Hollow Knight's test description for psoxide-test (the SDK's harness, tools/psoxide-test).
# It declares what to build and check; the harness decides how. Baseline: psoxide-test.baseline.toml.
# Original files (user config [inputs]): `hollow-knight`, the Windows Steam install the cook reads
# (CrossOver bottle); `hk-cook-store`, the cook store (docs/COOK-STORE.md) a build restores its
# cooked state from by key; `sdk`, a clean SDK checkout at the pin (sdk.lock.json), the
# --sdk-source and the overlay host tools (HK_OVERLAY_SDK).
schema = 1
name = "Hollow Knight (hk-psx)"
repository = "EBonura/hk-psx"

# The region cook (`cargo hk-build cook`: the store restore or the cook of 693 regions, 2 h from
# empty), a build of its own with no disc, keyed on the cooker code and scripts (host/, tools/) and
# the retail files, so its receipt skips it when only game code changed. The asset stage that
# follows the region cook runs inside `build` (its own cache, keyed by host/*.py and tools/*.py).
[[build]]
name = "cook"
out = "build/harness/cook"
commands = [["cargo", "hk-build", "cook", "--hollow-knight", "{input:hollow-knight}", "--sdk-source", "{input:sdk}"]]
env = { HK_COOK_STORE = "{input:hk-cook-store}", HK_OVERLAY_SDK = "{input:sdk}" }
env_remove = ["HK_GUEST_FEATURES", "HK_HOT_LAYOUT", "HK_INTRO"]
inputs = ["host/", "tools/", "sdk.lock.json", "rust-toolchain.toml"]

# The shipping disc (what the library gets): opening movies, hot text placed by game/hk.layout.
# Its walks compile to gate journeys in tests/walk-*.toml (git-ignored) for this disc.
[[build]]
name = "ship"
out = "build/harness/ship"
commands = [
  ["cargo", "hk-build", "build", "--no-validate", "--hollow-knight", "{input:hollow-knight}", "--sdk-source", "{input:sdk}", "--library", "{out}"],
  ["cargo", "hk-build", "walk-compile", "--library", "{out}"],
]
collect = { "game.map" = "build/hk-psx-normal.map", "hk-psx.exe" = "dist/hk-psx.exe", "build-normal.json" = ".hkpsx/build-normal.json", "hot-text.order" = "build/hot-text.order", "hot-text.order.placed" = "build/hot-text.order.placed" }
env = { HK_COOK_STORE = "{input:hk-cook-store}", HK_OVERLAY_SDK = "{input:sdk}", HK_WALK_SYNC = "poll" }
env_remove = ["HK_GUEST_FEATURES", "HK_HOT_LAYOUT", "HK_INTRO"]
disc = "Hollow Knight (hk-psx).cue"
map = "game.map"
# The ordering file the link followed (host/build_guest.py place_hot_text) and its .placed sidecar: the build
# stage runs `psoxide-pgo followed` on it against game.map, so the disc is proven to carry the searched layout.
order = "hot-text.order"
layout_files = ["game/hk.layout"]

# The route-input twin: what the route tapes replay (validate) and the speed windows measure.
# It runs last, so the tree's dist/, .hkpsx and build/ hold its artifacts, which validate reads.
# The memory cards the speed windows boot from are copied into its out (a replay writes its card
# back; a collect source must be written by the build, so they are copied by a command).
[[build]]
name = "twin"
out = "build/harness/twin"
commands = [
  ["cargo", "hk-build", "build", "--no-validate", "--hollow-knight", "{input:hollow-knight}", "--sdk-source", "{input:sdk}", "--library", "{out}"],
  ["cp", "tools/cards/secret-c37.mcd", "{out}/card-secret-c37.mcd"],
  ["cp", "tools/cards/kings-return.mcd", "{out}/card-kings-return.mcd"],
]
collect = { "game.map" = "build/hk-psx-normal.map", "hk-psx.exe" = "dist/hk-psx.exe", "build-normal.json" = ".hkpsx/build-normal.json", "build.json" = ".hkpsx/build.json", "hot-text.order" = "build/hot-text.order", "hot-text.order.placed" = "build/hot-text.order.placed" }
env = { HK_COOK_STORE = "{input:hk-cook-store}", HK_OVERLAY_SDK = "{input:sdk}", HK_GUEST_FEATURES = "route-input" }
env_remove = ["HK_HOT_LAYOUT", "HK_INTRO"]
disc = "Hollow Knight (hk-psx).cue"
map = "game.map"
order = "hot-text.order"

# The original files by content (the digest is the build stage's input:NAME fact): the retail
# install the cook read, and the SDK checkout at the pin. The cook store is not pinned: it is a
# cache that a cook publishes into.
[originals]
hollow-knight = "3521cb92cf9d68f48de9063aa3d3fabf75b0670b7451c519079e43c9723496de"
sdk = "6f9c12f5343e12b450c853df3b9da6b763305012829379746ed68ce06059a3c4"

[[size]]
build = "ship"

# Two of the frame table's 16-shift routes (tools/hot-layout.sh weighs the layout by them), from
# after the save's load to the tape's end; offsets are the phase shifts in pad polls.
# c37-stand is placement-sensitive (hk-fix 2026-11-21, emulator): the same code with one cold
# load-time function moved in the link order loses 2.3% of its flips, so compare builds by the
# mean over tape phase shifts (input started 0, 1, 3, 5, 7, 11, 16 polls later), not by one
# phase. The fce1 baseline's 949 flips was its best phase (935 to 949, mean 940.4).
[[speed]]
name = "c37-stand"
build = "twin"
tape = "tools/tapes/c37-stand.pxtape"
polls = [700, 2900]
offsets = [-48, -36, -24, -12, 0, 12, 24, 36]
launch_args = ["--embedded-playtest", "--memcard", "build/harness/twin/card-secret-c37.mcd"]

[[speed]]
name = "kings-return"
build = "twin"
tape = "tools/tapes/kings-return.pxtape"
polls = [700, 1900]
offsets = [-48, -36, -24, -12, 0, 12, 24, 36]
launch_args = ["--embedded-playtest", "--memcard", "build/harness/twin/card-kings-return.mcd"]

# The walks (tools/walks, compiled by the ship build) and the smoke.
[journeys]
files = "tests/walk-*.toml"
precheck = ["walk-smoke", "walk-fungus1-06"]

[cross]
smoke = ["tests/walk-smoke.toml"]

# The route tapes, the closed-loop routes (journey-kings, journey-crossroads) and the power-cut
# check, on the twin, with the game's own judge (pins, pacing ceilings, brightness, scene gates).
# The walks are the journeys stage's. One replay at a time keeps it inside the emulator budget.
# HK_PSX_GATE_SHA256 is the sha256 of the configured gate: validate refuses a gate it cannot check.
[[host]]
name = "validate-routes"
build = "twin"
command = ["cargo", "hk-build", "validate", "--library", "{out}", "--prune", "--jobs", "1", "--frontend", "{tool:frontend}", "--gate", "{tool:gate}", "--hollow-knight", "{input:hollow-knight}", "--sdk-source", "{input:sdk}"]
env = { HK_VALIDATE_NO_WALKS = "1", HK_PSX_GATE_SHA256 = "{tool_sha256:gate}", HK_COOK_STORE = "{input:hk-cook-store}", HK_OVERLAY_SDK = "{input:sdk}", HK_GUEST_FEATURES = "route-input" }
env_remove = ["HK_HOT_LAYOUT", "HK_INTRO", "HK_VALIDATE_ONLY"]
exclusive = "tree"
# Keyed on what validate reads: the driver and its scripts, tapes and cards (host/, tools/), the game
# sources it cooks from, the twin build's bytes (build), the SDK's guest sources, the gate and the
# frontend. sdk.lock.json is left out on purpose: a pin to another commit with the same guest tree
# changes nothing validate sees (uses "sdk" follows the guest sources), so it does not run again.
inputs = ["host/", "tools/", "shared/", "game/", "intro/", "xa-encoder.lock.json", "rust-toolchain.toml"]
uses = ["sdk", "gate", "frontend"]
# It replays routes with --jobs 1: hold one machine emulator slot while it runs.
emulators = 1

# Load-delay hazards in guest asm (fleet rule since SDK 580daa02), with the pin's own scanner.
[[host]]
name = "check-mfc0"
command = ["cargo", "run", "-q", "--release", "--locked", "--manifest-path", ".psoxide/tools/psoxide-hazard/Cargo.toml", "--bin", "check-mfc0", "--", "game", "shared", "intro"]
exclusive = "tree"

[clean]
build = "ship"
seed = [".psoxide"]
compare = ["Hollow Knight (hk-psx).bin", "Hollow Knight (hk-psx).cue", "hk-psx.exe"]

[[install]]
build = "ship"
