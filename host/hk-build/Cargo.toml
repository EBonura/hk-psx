[package]
name = "hk-psx-build"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Single-command build, disc and validation driver for hk-psx"

[[bin]]
name = "hk-psx-build"
path = "main.rs"

[[bin]]
name = "hk-module-image"
path = "module_image.rs"

[[bin]]
name = "hk-module-publish"
path = "module_publish.rs"

[dependencies]
hk-cook = { path = "../hk-cook" }
serde_json = "1"
sha2 = "0.10"
hk-fsm-cook = { path = "../hk-fsm" }

psoxide-hazard = { path = "../../.psoxide/tools/psoxide-hazard" }
psx-residency = { path = "../../.psoxide/sdk/crates/psx-residency" }
