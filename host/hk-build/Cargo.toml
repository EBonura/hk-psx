[package]
name = "hk-psx-build"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Single-command build, disc and validation driver for hk-psx"

[[bin]]
name = "hk-psx-build"
path = "main.rs"

[[bin]]
name = "hk-module-image"
path = "module_image.rs"

[[bin]]
name = "hk-module-publish"
path = "module_publish.rs"

[dependencies]
hk-cook = { path = "../hk-cook" }
serde_json = "1"
sha2 = "0.10"
# clonefile and the extent query of the cook store (host/hk-build/cook_store.rs); macOS only in use.
libc = "0.2"
hk-fsm-cook = { path = "../hk-fsm" }
# The games-library install, shared by every game. A host-only crate, so it is pinned on its own
# revision and does not move the guest SDK pin (sdk.lock.json).
psx-library = { git = "https://github.com/EBonura/PSoXide.git", rev = "7528f3e36e5f4ba21cb126302977d24834179e5d" }

psoxide-hazard = { path = "../../.psoxide/tools/psoxide-hazard" }
psx-residency = { path = "../../.psoxide/sdk/crates/psx-residency" }
