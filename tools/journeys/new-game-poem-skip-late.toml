# New Game on the shipping disc: a first press late in the poem (22 s: the piano is over and the game is loading the first
# scene behind the poem) shows "Press any button to skip", a second one while it shows skips the poem and both movies,
# and the Knight drops in once the load has finished.
#
#   psoxide-gate run tools/journeys/new-game-poem-skip.toml --disc <Hollow Knight (hk-psx).cue> --no-hw --out <dir>
#
# from the repository root, with build/hk-psx.map the link map of that disc. The disc is the shipping one (the poem
# and the movies are not on a test disc). Route-split: no pad tape.
name = "new-game-poem-skip-late"
title = "new game: skip the poem late, while the first scene loads behind it"
disc = ["lib/Hollow Knight (hk-psx).cue"]
symbols = ["build/hk-psx.map"]
max_ticks = 200000

[[step]]
label = "title"
wait = 300

[[step]]
label = "Start Game"
press = ["cross"]
hold = 3

[[step]]
wait = 40

[[step]]
label = "profile 1, an empty one: a new game"
press = ["cross"]
hold = 3

[[step]]
label = "poem-22s: the piano is over, the first scene is loading behind the poem"
wait = 1320
checkpoint = "poem-22s"
golden = false
no_matrix = true

[[step]]
label = "any button: the prompt appears over the poem"
press = ["triangle"]
hold = 3

[[step]]
wait = 40
checkpoint = "prompt"
golden = false
no_matrix = true

[[step]]
label = "a second press while it shows skips everything"
press = ["triangle"]
hold = 3

[[step]]
label = "the Knight drops in (region 79 = the top view of the shaft)"
timeout = 7200
[step.wait_until]
kind = "ram"
sym = "HK_REGION_ID"
op = "eq"
value = 79

[[step]]
label = "the Knight is at the top of the shaft"
timeout = 600
[step.wait_until]
kind = "ram"
sym = "HK_PLAYER_Y"
op = "gt"
value = 3_000_000

[[step]]
label = "he has landed on the ledge and stays there"
timeout = 1800
[step.wait_until]
kind = "ram"
sym = "HK_PLAYER_Y"
op = "lt"
value = 800_000

[[step]]
label = "settled on the ledge, unhurt"
wait = 180
checkpoint = "landed"
golden = false
no_matrix = true
[[step.assert]]
kind = "ram"
sym = "HK_PLAYER_Y"
op = "between"
value = 720_000
value_hi = 770_000
[[step.assert]]
kind = "ram"
sym = "HK_DEATHS"
op = "eq"
value = 0
