# Two seconds of consecutive frames of each movie (a checkpoint every 4 ticks, a frame is 4 ticks), to judge how the dither moves:
# the Prologue at tick 3500 and the Intro at tick 4500 on this build, 30 frames each (the frame each shows is found
# in the decoded stream by matching).
#
#   psoxide-gate run tools/journeys/new-game-movie-strip.toml --disc <Hollow Knight (hk-psx).cue> --no-hw --out <dir>
#
name = "new-game-movie-strip"
title = "new game: two seconds of frames in each movie"
disc = ["lib/Hollow Knight (hk-psx).cue"]
symbols = ["build/hk-psx.map"]
max_ticks = 200000

[[step]]
label = "title"
wait = 300

[[step]]
label = "Start Game"
press = ["cross"]
hold = 3

[[step]]
wait = 40

[[step]]
label = "profile 1, an empty one: a new game"
press = ["cross"]
hold = 3


