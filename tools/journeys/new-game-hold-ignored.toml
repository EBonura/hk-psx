# The shoulder hold is test input. On a shipping disc (no `route-input` feature) holding L1 R1 L2 R2 while the
# profile is chosen changes nothing: the Knight still drops in from the top gate. Same checks as new-game-lands.toml.
# The shipping disc plays the opening movies first, so the journey skips them with two presses (the first shows the
# prompt, the second skips).
#
#   psoxide-gate run tools/journeys/new-game-hold-ignored.toml --disc <Hollow Knight (hk-psx).cue> --no-hw --out <dir>
name = "new-game-hold-ignored"
title = "new game: the shoulder hold is ignored on a shipping disc"
disc = ["lib/Hollow Knight (hk-psx).cue"]
symbols = ["build/hk-psx.map"]
max_ticks = 200000

[[step]]
label = "title"
# The title's page sequence opens input at about 200 ticks on the old texture timing and about 245 on emulator 0e87b3a
# (the title's textured draws now take longer a frame; menu.rs input_at counts frames); 300 leaves a margin on both.
wait = 300

[[step]]
label = "Start Game"
press = ["cross"]
hold = 3

[[step]]
wait = 40

[[step]]
label = "profile 1, an empty one: a new game, with L1 R1 L2 R2 held"
press = ["cross", "l1", "r1", "l2", "r2"]
hold = 3

[[step]]
label = "the poem is playing"
wait = 600

[[step]]
label = "a first press shows the skip prompt"
press = ["triangle"]
hold = 3

[[step]]
wait = 40

[[step]]
label = "a second press skips the movies"
press = ["triangle"]
hold = 3

[[step]]
label = "the Knight drops in (region 79 = the top view of the shaft)"
timeout = 7200
[step.wait_until]
kind = "ram"
sym = "HK_REGION_ID"
op = "eq"
value = 79

[[step]]
label = "the Knight is at the top of the shaft"
timeout = 600
[step.wait_until]
kind = "ram"
sym = "HK_PLAYER_Y"
op = "gt"
value = 3_000_000

[[step]]
label = "the Knight starts at the top of the shaft"
checkpoint = "start"
golden = false
no_matrix = true
[[step.assert]]
kind = "ram"
sym = "HK_PLAYER_Y"
op = "gt"
value = 3_000_000
note = "above y 45.8 in Q16: the drop begins at the top gate, not on the ledge"

[[step]]
label = "he has landed: on the ledge height, not below it"
timeout = 1200
[step.wait_until]
kind = "ram"
sym = "HK_PLAYER_Y"
op = "lt"
value = 800_000

[[step]]
label = "settled on the ledge"
wait = 120
checkpoint = "landed"
golden = false
no_matrix = true
[[step.assert]]
kind = "ram"
sym = "HK_PLAYER_Y"
op = "between"
value = 720_000
value_hi = 770_000
note = "the ledge (y 11.37, Q16 745,000), not the chasm below"
[[step.assert]]
kind = "ram"
sym = "HK_DEATHS"
op = "eq"
value = 0

[[step]]
label = "and he stays there"
wait = 600
checkpoint = "stays"
golden = false
no_matrix = true
[[step.assert]]
kind = "ram"
sym = "HK_PLAYER_Y"
op = "between"
value = 720_000
value_hi = 770_000
[[step.assert]]
kind = "ram"
sym = "HK_DEATHS"
op = "eq"
value = 0
[[step.assert]]
kind = "ram"
sym = "HK_HEALTH"
op = "ge"
value = 5
note = "a fall onto the ledge costs nothing"
