# Frames spaced through both movies on the shipping disc, for same-moment comparison with the source clips (the
# review's PC | PS1 pairs): a checkpoint every 150 ticks of the Prologue and every 200 of the Intro. The movie
# frame a checkpoint shows is found by matching it against the decoded stream (the Prologue starts about tick 2144,
# the Intro about 3976 on this build; a frame is 4 ticks).
#
#   psoxide-gate run tools/journeys/new-game-movie-frames.toml --disc <Hollow Knight (hk-psx).cue> --no-hw --out <dir>
#
name = "new-game-movie-frames"
title = "new game: frames through both movies"
disc = ["lib/Hollow Knight (hk-psx).cue"]
symbols = ["build/hk-psx.map"]
max_ticks = 200000

[[step]]
label = "title"
wait = 300

[[step]]
label = "Start Game"
press = ["cross"]
hold = 3

[[step]]
wait = 40

[[step]]
label = "profile 1, an empty one: a new game"
press = ["cross"]
hold = 3

[[step]]
label = "f2300"
wait = 1954
checkpoint = "f2300"
golden = false
no_matrix = true

