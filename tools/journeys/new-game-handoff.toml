# The hand-off measured: New Game on the shipping disc, left alone. The game starts loading the first scene during
# the poem (disc.rs `preload`), so its VBlank counter no longer marks the end of the movies: the game sets
# HK_GAME_MODE to 2 when it begins to admit the first scene, which is the moment the last movie frame is gone, and the
# Knight at the top of the shaft is the first gameplay frame. The ticks between the two are what is left of the new
# game's scene load (route log: tools in the lane notes): 136 at the first version (2.3 s), 343 (5.7 s) before the
# poem carried the load, 790 (13.2 s) when the program chain-loaded the game back.
#
#   psoxide-gate run tools/journeys/new-game-handoff.toml --disc <Hollow Knight (hk-psx).cue> --no-hw --out <dir>
#
# Route-split: no pad tape. The disc is the shipping one (the test disc has neither poem nor movies); `symbols`
# resolves against the working directory (build/hk-psx.map).
name = "new-game-handoff"
title = "new game: from the last movie frame to the first gameplay frame"
disc = ["lib/Hollow Knight (hk-psx).cue"]
symbols = ["build/hk-psx.map"]
max_ticks = 200000

[[step]]
label = "title"
wait = 300

[[step]]
label = "Start Game"
press = ["cross"]
hold = 3

[[step]]
wait = 40

[[step]]
label = "profile 1, an empty one: a new game"
press = ["cross"]
hold = 3

[[step]]
label = "the movies are over: the game starts admitting the first scene"
timeout = 12000
checkpoint = "return"
golden = false
no_matrix = true
[step.wait_until]
kind = "ram"
sym = "HK_GAME_MODE"
op = "eq"
value = 2

[[step]]
label = "first gameplay frame: the Knight at the top of the shaft"
timeout = 3000
checkpoint = "drop"
golden = false
no_matrix = true
[step.wait_until]
kind = "ram"
sym = "HK_PLAYER_Y"
op = "gt"
value = 3_000_000
