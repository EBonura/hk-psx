[build]
target = "mipsel-sony-psx"
# Relative to game/, so the image stays at game/target/... now that the
# workspace root is the repository root (the driver sets CARGO_TARGET_DIR).
target-dir = "target"
[unstable]
build-std = ["core"]
build-std-features = ["compiler-builtins-mem"]

# The program's exceptions to the SDK architecture gate (sdk/docs/GATE.md), at the repository root.
[env]
PSX_GATE_FILE = { value = "../psx-gate.toml", relative = true }
