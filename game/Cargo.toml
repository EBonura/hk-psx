[package]
name = "hk-psx"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
[features]
emulator-telemetry = ["psx-telemetry/emit"]
# Console probes for the music transport instead of the game (audio_probe.rs).
audio-probe = []
# Memory card diagnostics for a console (card_diag.rs): a CARD DIAG page after the
# title and a two-line state overlay in play. A diagnostic disc only, never shipped.
card-diag = []
# The per-tick HK_TRACE block (trace.rs) for the replay harness: 512 bytes of RAM and
# 1,260 of code that the shipped disc has no use for. No in-tree tool reads it yet.
trace = []
# Seamless-transition study: scripted gate tour and per-phase gate timing.
# Gate phase timing (HK_GATE_LOG) in an otherwise ordinary build, for walking routes.
gate-log = []
# Drive-event ring (HK_EVENT_LOG) for diagnosing one gate; 2 KB of BSS.
gate-events = ["gate-log"]
gate-tour = ["gate-log"]
# Tour builds only: prefetch the tour's next scene instead of predicting it.
prefetch-oracle = ["gate-tour"]
# Tour builds only: walk the Knight to each listed gate instead of standing (real predictor).
tour-walk = ["gate-tour"]
# Spike: decode and upload the next scene's atlases ahead of its gate.
vram-ahead = []
# The original's HeroLight behind the Knight and the hero vignette
# (hero_light.rs). On the 49 builder routes the two together cost 0.71% of
# presented fps on average and 3.90% at worst (boss-fight); the palette
# grade is free and always on.
default = ["hero-light", "hero-vignette", "original-latency", "load-log"]
hero-light = []
hero-vignette = []
# The original's one-frame walk/jump latency in the Knight's simulation
# (input.rs hero_latency); menus stay immediate. The route tapes are encoded
# for it; a build without it needs the tapes as of e3cbd87.
original-latency = []
# Per-tick poll ordinal and consumer, for re-encoding route tapes (input.rs).
tick-log = []
# Greenpath's Hornet (enemies/hornet.rs): the boss tier of the FSM kernel and her fight, in the Fungus1_04 room module. The build
# turns it on when the Hornet postpass has written data/hornet_art.rs.
hornet = ["hk-sim/boss"]
# Scene-load poll telemetry (input.rs HK_LOAD_LOG): per load, the poll count when it
# resumed and when gameplay was published, which is how a route's neutral ticks are measured.
load-log = []
# The opening movies on a new game (intro.rs): the player travels as a blob in the boot art chunk, which only a
# build with this feature (HK_INTRO=1, `cargo hk-build build --intro`) reads.
intro = []
# Route input (menu.rs skip_drop): holding L1 R1 L2 R2 while a save slot is chosen starts a new game on
# King's Pass's ledge instead of with the drop from the top gate, which is where every recorded route tape begins.
# Test discs only (HK_GUEST_FEATURES=route-input, the disc `cargo hk-build validate` plays); a shipping build
# has no such input.
route-input = []
[dependencies]
psx-math = { path = "../.psoxide/sdk/crates/psx-math" }
psx-residency = { path = "../.psoxide/sdk/crates/psx-residency" }
# 256 trampoline words: with every delay-slot filler search on, the ordinary
# guest needs 117 and pgo's profiling build 147; psx-rt's default holds 96.
psx-rt = { path = "../.psoxide/sdk/crates/psx-rt", features = ["hazard-trampolines-256"] }
psx-tick = { path = "../.psoxide/sdk/crates/psx-tick" }
psx-gpu = { path = "../.psoxide/sdk/crates/psx-gpu" }
psx-pad = { path = "../.psoxide/sdk/crates/psx-pad" }
psx-vram = { path = "../.psoxide/sdk/crates/psx-vram" }
psx-telemetry = { path = "../.psoxide/sdk/crates/psx-telemetry" }
psx-pack = { path = "../.psoxide/sdk/crates/psx-pack" }
psx-spu = { path = "../.psoxide/sdk/crates/psx-spu" }
psx-mc = { path = "../.psoxide/sdk/crates/psx-mc" }

hk-format = {path="../shared/hk-format"}
hk-sim = {path="../shared/hk-sim"}
hk-cache = {path="../shared/hk-cache"}
psx-io = { path = "../.psoxide/sdk/crates/psx-io" }
psx-hw = { path = "../.psoxide/crates/psx-hw" }
psx-fmv = { path = "../.psoxide/sdk/crates/psx-fmv" }
